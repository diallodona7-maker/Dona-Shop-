<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONA SHOP - ADMIN</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

header{
background:#000;
color:#fff;
padding:20px;
text-align:center;
}

.container{
background:#fff;
max-width:800px;
margin:20px auto;
padding:20px;
border-radius:10px;
}

h2{
color:#d40000;
}

input, textarea{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#d40000;
color:white;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#aa0000;
}
</style>

</head>
<body>

<header>
<h1>DONA SHOP - ADMIN</h1>
</header>

<div class="container">

<h2>Informations de la boutique</h2>

<label>Logo de la boutique</label>
<input type="file">

<label>Photo de couverture</label>
<input type="file">

<label>Couleur principale de la boutique</label>
<input type="color">

<h2>Informations du produit</h2>

<label>Photo du produit</label>
<input type="file">

<label>Vidéo du produit</label>
<input type="file">

<label>Nom du produit</label>
<input id="nomProduit" type="text" placeholder="Nom du produit">

<label>Catégorie du produit</label>
<input type="text" placeholder="Ex : Casque Bluetooth">

<label>Prix du produit</label>
<input id="prixProduit" type="number" placeholder="Prix en FCFA">

<label>Ancien prix (promotion)</label>
<input type="number" placeholder="Ancien prix">

<label>Description du produit</label>
<textarea rows="4" placeholder="Description du produit"></textarea>

<label>
<input type="checkbox" checked>
Produit 100 % neuf
</label>

<br><br>

<label>Quantité disponible</label>
<input type="number" placeholder="Quantité">

<h2>Livraison</h2>

<label>
<input type="checkbox" checked>
Livraison partout en Côte d'Ivoire
</label>

<br><br>

<label>
<input type="checkbox" checked>
Livraison rapide à Abidjan
</label>

<br><br>

<label>Délai de livraison</label>
<input type="text" value="24 heures">

<h2>Paiement</h2>

<label><input type="checkbox" checked> Wave</label><br>
<label><input type="checkbox" checked> Mobile Money</label><br>
<label><input type="checkbox" checked> Paiement à la livraison</label>

<h2>WhatsApp</h2>

<input type="text" value="0508537634">

<br><br>

<button id="publierProduit">
PUBLIER LE PRODUIT
</button>

</div>

<script src="admin.js"></script>

</body>
</html>
