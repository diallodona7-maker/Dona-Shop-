<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONA SHOP - Boutique</title>
</head>

<body>

<h1>DONA SHOP - BOUTIQUE</h1>

<div id="produits"></div>

<script>

const produit = JSON.parse(localStorage.getItem("produit"));

if (produit) {

document.getElementById("produits").innerHTML = `
    <h2>${produit.nom}</h2>
    <p>Prix : ${produit.prix} FCFA</p>
`;

} else {

document.getElementById("produits").innerHTML =
"<p>Aucun produit disponible.</p>";

}

</script>

</body>
</html>
